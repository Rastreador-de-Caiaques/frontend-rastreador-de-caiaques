<div class="mapa-container" [class.com-detalhe]="!!caiaaqueSelecionado">

  <header class="header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M3 13.5C3 13.5 5 10 12 10s9 3.5 9 3.5v1s-2 1.5-9 1.5-9-1.5-9-1.5v-1z"/>
        <path d="M7 10.5L9 7h6l2 3.5"/>
        <circle cx="12" cy="5.5" r="1.5"/>
      </svg>
      <span>Rastreador</span>
    </div>
    <button class="header-status" (click)="abrirPainelStatus()">
      <span class="sync-dot" [class.sync-dot--off]="!servidorConectado"></span>
      <span class="sync-texto">
        {{ servidorConectado ? formatarHora(ultimaSync) : 'Desconectado' }}
      </span>
    </button>
  </header>

  <aside class="frota" aria-label="Frota de hoje">
    <div class="frota-topo">
      <div class="frota-titulo">
        <span class="frota-nome">Frota de hoje</span>
        <span class="frota-resumo">{{ resumo }}</span>
      </div>
      <div class="filtros" role="group" aria-label="Filtrar caiaques">
        <button type="button" class="filtro" [class.filtro--ativo]="filtro === 'todos'" (click)="filtro = 'todos'">Todos {{ caiaques.length }}</button>
        <button type="button" class="filtro" [class.filtro--ativo]="filtro === 'ao-vivo'" (click)="filtro = 'ao-vivo'">Ao vivo {{ contar('ao-vivo') }}</button>
        <button type="button" class="filtro filtro--alerta" [class.filtro--ativo]="filtro === 'alerta'" (click)="filtro = 'alerta'">Alerta {{ contar('sem-sinal') }}</button>
      </div>
    </div>

    <div class="frota-lista">
      <p class="vazio" *ngIf="caiaques.length === 0">
        Nenhum caiaque enviando sinal agora. Eles aparecem aqui assim que a base receber o primeiro pacote.
      </p>

      <ng-container *ngIf="atencao.length">
        <h2 class="secao secao--alerta">Precisa de atenção · {{ atencao.length }}</h2>
        <button type="button" class="linha linha--sem-sinal" *ngFor="let c of atencao; trackBy: porId"
                [class.linha--ativa]="caiaaqueSelecionado?.id === c.id" (click)="selecionarCaiaque(c)">
          <span class="num num--sem-sinal">{{ c.id }}</span>
          <span class="linha-texto">
            <span class="linha-titulo">{{ c.nome }}</span>
            <span class="linha-sub">Visto {{ ha(c) }} · última posição no mapa</span>
          </span>
          <span class="selo-estado selo-estado--sem-sinal">! Sem sinal</span>
        </button>
      </ng-container>

      <ng-container *ngIf="emPasseio.length">
        <h2 class="secao">Em passeio · {{ emPasseio.length }}</h2>
        <button type="button" class="linha" *ngFor="let c of emPasseio; trackBy: porId"
                [class.linha--ativa]="caiaaqueSelecionado?.id === c.id" (click)="selecionarCaiaque(c)">
          <span class="num" [class.num--fraco]="c.estado === 'fraco'">{{ c.id }}</span>
          <span class="linha-texto">
            <span class="linha-titulo">{{ c.nome }}</span>
            <span class="linha-sub">no mar há {{ noMar(c) }} · {{ ha(c) }}</span>
          </span>
          <span class="selo-estado" [class.selo-estado--fraco]="c.estado === 'fraco'">
            {{ c.estado === 'fraco' ? '◐ Sinal fraco' : '● Ao vivo' }}
          </span>
        </button>
      </ng-container>
    </div>
  </aside>

  <div class="area-mapa">
    <div id="mapa"></div>

    <button type="button" class="btn-centralizar" (click)="centralizarMapa()" aria-label="Mostrar todos os caiaques no mapa">⊙</button>

    <button type="button" class="faixa-alerta" role="alert" *ngIf="atencao.length" (click)="selecionarCaiaque(atencao[0])">
      <b>! {{ atencao[0].nome }}</b>
      <span>sem sinal · visto {{ ha(atencao[0]) }} · última posição marcada</span>
      <span *ngIf="atencao.length > 1" class="faixa-mais">+{{ atencao.length - 1 }}</span>
    </button>
  </div>

  <!-- Toasts de notificação -->
  <div class="notificacoes">
    <div
      *ngFor="let n of notificacoes"
      class="notif"
      [class.notif--saindo]="n.saindo"
      [class.notif--sucesso]="n.cor === 'sucesso'"
      [class.notif--erro]="n.cor === 'erro'"
      [class.notif--info]="n.cor === 'info'"
    >
      <span class="notif-barra"></span>
      <span class="notif-texto">{{ n.mensagem }}</span>
    </div>
  </div>

  <app-painel-caiaque
    [caiaque]="caiaaqueSelecionado"
    (fechar)="fecharPainel()"
    (encerrar)="encerrarPasseio($event)"
  ></app-painel-caiaque>

  <app-painel-status
    [aberto]="painelStatusAberto"
    (fechar)="painelStatusAberto = false"
  ></app-painel-status>

</div>
